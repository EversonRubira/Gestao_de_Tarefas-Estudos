name: Build & Release AAB

# ─────────────────────────────────────────────────────────────────────────────
# Dispara automaticamente em cada push para master
# Também pode ser disparado manualmente no separador "Actions" do GitHub
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versão do app (ex: 1.1)'
        required: false
        default: ''

jobs:
  build:
    name: Compilar e assinar AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout do código ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Configurar Java 17 ───────────────────────────────────────────────
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Permissão para executar Gradle ──────────────────────────────────
      - name: Permissão Gradle
        run: chmod +x gradlew

      # ── 4. Executar testes unitários ────────────────────────────────────────
      - name: Executar testes
        run: ./gradlew test --no-daemon

      # ── 5. Reconstruir keystore a partir do GitHub Secret ──────────────────
      # A keystore é guardada como base64 num GitHub Secret (KEYSTORE_BASE64)
      # e reconstruída aqui temporariamente durante o build
      - name: Restaurar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > studyflow-release.jks

      # ── 6. Criar keystore.properties para o Gradle ─────────────────────────
      - name: Criar keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=../studyflow-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # ── 7. Compilar e assinar o AAB de release ─────────────────────────────
      - name: Build AAB release
        run: ./gradlew bundleRelease --no-daemon

      # ── 8. Renomear o AAB com versão e data ────────────────────────────────
      - name: Renomear AAB
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          DATE=$(date +'%Y%m%d')
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/studyflow-v${VERSION}-${DATE}.aab
          echo "AAB_NAME=studyflow-v${VERSION}-${DATE}.aab" >> $GITHUB_ENV

      # ── 9. Publicar AAB como artefato para download ─────────────────────────
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_NAME }}
          path: app/build/outputs/bundle/release/${{ env.AAB_NAME }}
          retention-days: 30

      # ── 10. Limpar ficheiros sensíveis ─────────────────────────────────────
      - name: Limpar keystore
        if: always()
        run: |
          rm -f studyflow-release.jks
          rm -f keystore.properties
